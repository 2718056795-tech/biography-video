interface:
  display_name: "人物生平动画"
  short_description: "史料解读、角色动画、累计行程与固定配乐的生平视频及必交竖屏封面"
  default_prompt: "使用 $historical-biography-video 为指定人物制作生平动画。默认1080×1920、30fps、120秒、12章、无旁白，沿用固定版式、字库与原配乐，地图已到地名常驻、行程线统一粗细。逐人核查史料，按时代与经历设计配色、背景、器物和实际动作。交付真实MP4、独立1200×1500 PNG封面及来源与验收报告，如实说明未验证项；用户新的明确要求优先。"
