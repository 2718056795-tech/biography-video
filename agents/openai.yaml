interface:
  display_name: "人物生平动画"
  short_description: "史料解读、角色动画、累计行程与固定配乐的生平视频及必交竖屏封面"
  default_prompt: "使用 $historical-biography-video 为指定人物制作生平动画。默认1080×1920、30fps、120秒、12章、无旁白，沿用固定版式、字库与原配乐，开篇地图全程只显示地理底图；地点引入前不显示新地点、城市点或行程，之后已到地名常驻、行程线统一粗细，旧overview也不能预览全路线。逐人核查史料，按时代与经历设计配色、器物和实际动作；按各幕地点和情节绘制对应布景。整片编码前查看12幕实际美术缩略图，修正布景误复用。交付真实MP4、独立1200×1500 PNG封面及来源与验收报告，如实说明未验证项；用户新的明确要求优先。"
